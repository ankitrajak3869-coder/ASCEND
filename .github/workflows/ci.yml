name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage --coverage-path=coverage/lcov.info

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=ASCEND_ENV=prod --dart-define=ASCEND_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} --dart-define=ASCEND_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk