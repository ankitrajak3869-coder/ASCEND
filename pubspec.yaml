name: ascend
description: "Ascend - Your Life is the Game. Turn real life into an RPG."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cloud_firestore: ^6.8.0
  firebase_analytics: ^12.4.6
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  go_router: ^17.4.0
  intl: any

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_foreground.png
  remove_alpha_ios: true
  background_color: "#0E1116"

flutter_native_splash:
  color: "#0E1116"
  image: assets/images/splash_logo.png
  android_12:
    color: "#0E1116"
    image: assets/images/splash_logo.png